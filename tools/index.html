<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PilotDesk Tool Library</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ivory:   #F8F7F6;
  --teal:    #1A3948;
  --teal2:   #24506A;
  --flame:   #FF5400;
  --stone:   #B9CCCC;
  --honey:   #FFC047;
  --border:  rgba(26,57,72,0.09);
  --muted:   rgba(26,57,72,0.52);
  --soft:    rgba(26,57,72,0.36);
  --glass:   rgba(255,255,255,0.55);
  --glass-b: rgba(255,255,255,0.85);
  --gs: 0 8px 32px rgba(26,57,72,0.10), 0 1.5px 4px rgba(26,57,72,0.06);
  --gi: inset 0 1px 0 rgba(255,255,255,0.92), inset 0 -1px 0 rgba(26,57,72,0.03);
  --eo: cubic-bezier(0.25,0.46,0.45,0.94);
  --serif: 'Lora', Georgia, serif;
  --sans:  'Noto Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: var(--sans); color: var(--teal);
  -webkit-font-smoothing: antialiased;
}
.scene {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
  background: #F0EFED;
}
.orb { position: absolute; border-radius: 50%; filter: blur(90px); }
.o1 { width: 580px; height: 460px; top: -120px; left: -100px;
  background: radial-gradient(ellipse, rgba(255,84,0,0.30) 0%, rgba(255,140,60,0.13) 45%, transparent 70%); }
.o2 { width: 460px; height: 380px; top: 35%; right: -120px;
  background: radial-gradient(ellipse, rgba(26,57,72,0.14) 0%, rgba(26,57,72,0.04) 55%, transparent 75%); }
.o3 { width: 360px; height: 300px; bottom: 12%; left: 28%;
  background: radial-gradient(ellipse, rgba(255,192,71,0.16) 0%, transparent 65%); }

.nav-wrap { position: sticky; top: 0; z-index: 50; display: flex; justify-content: center; padding: 12px 24px 0; pointer-events: none; }
.nav-pill { display: inline-flex; align-items: center; gap: 2px; background: rgba(26,57,72,0.80);
  backdrop-filter: blur(28px) saturate(2); -webkit-backdrop-filter: blur(28px) saturate(2);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 100px; padding: 5px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.22), 0 2px 8px rgba(0,0,0,0.14),
    inset 0 1px 0 rgba(255,255,255,0.14), inset 0 -1px 0 rgba(0,0,0,0.18);
  pointer-events: all; }
.wordmark { font-family: var(--serif); font-size: 17px; color: rgba(248,247,246,0.92);
  padding: 6px 16px 6px 12px; border-right: 1px solid rgba(255,255,255,0.10); margin-right: 4px; }
.wordmark em { font-style: normal; color: var(--flame); font-weight: 600; }
.ntab { font-size: 13px; font-weight: 500; color: rgba(185,204,204,0.72); padding: 7px 16px;
  border-radius: 100px; cursor: pointer; transition: color 180ms, background 180ms; }
.ntab:hover { color: rgba(248,247,246,0.95); }
.ntab.on { background: rgba(255,255,255,0.13); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -1px 0 rgba(0,0,0,0.12); }

.wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 36px 24px 80px; }

.hero { text-align: center; margin-bottom: 30px; }
.eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--soft); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 7px; }
.pdot { width: 6px; height: 6px; border-radius: 50%; background: var(--flame); animation: pring 2.5s ease-in-out infinite; }
@keyframes pring { 0%,100% { box-shadow: 0 0 0 0 rgba(255,84,0,0.4); } 50% { box-shadow: 0 0 0 5px rgba(255,84,0,0); } }
h1 { font-family: var(--serif); font-weight: 400; font-size: 38px; margin: 0 0 8px; color: var(--teal); letter-spacing: -0.01em; }
h1 em { font-style: normal; color: var(--flame); }
.sub { font-size: 14.5px; color: var(--muted); max-width: 560px; margin: 0 auto; line-height: 1.5; }

.searchbar { max-width: 620px; margin: 26px auto 0; position: relative; }
.searchbar input {
  width: 100%; font-family: var(--sans); font-size: 15px; color: var(--teal);
  padding: 15px 20px 15px 46px; border-radius: 100px;
  background: var(--glass); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  border: 1px solid var(--glass-b); box-shadow: var(--gs), var(--gi);
  outline: none; transition: box-shadow 200ms var(--eo);
}
.searchbar input:focus { box-shadow: 0 0 0 3px rgba(255,84,0,0.16), var(--gs), var(--gi); }
.searchbar svg { position: absolute; left: 19px; top: 50%; transform: translateY(-50%); color: var(--soft); pointer-events: none; }
.searchbar .clr {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer;
  background: rgba(26,57,72,0.08); color: var(--muted); font-size: 14px; display: none;
  align-items: center; justify-content: center;
}
.searchbar .clr.show { display: flex; }

.statline { text-align: center; font-size: 12px; color: var(--soft); margin-top: 14px; }
.statline b { color: var(--flame); font-weight: 700; }

.layout { display: grid; grid-template-columns: 250px 1fr; gap: 22px; margin-top: 34px; align-items: start; }

.sidebar {
  position: sticky; top: 84px;
  background: var(--glass); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  border: 1px solid var(--glass-b); box-shadow: var(--gs), var(--gi);
  border-radius: 18px; padding: 16px; max-height: calc(100vh - 110px); overflow-y: auto;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(26,57,72,0.18); border-radius: 10px; }
.sb-title { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); padding: 4px 10px 10px; }
.cat-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--muted); transition: background 150ms, color 150ms;
}
.cat-item:hover { background: rgba(26,57,72,0.06); color: var(--teal); }
.cat-item.on { background: var(--teal); color: var(--ivory); }
.cat-item .n { font-size: 11px; font-weight: 700; opacity: 0.65; }
.cat-item.on .n { opacity: 0.85; }

.main-col { min-width: 0; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.card {
  border-radius: 16px; padding: 18px 20px; background: var(--glass);
  backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  border: 1px solid var(--glass-b); box-shadow: var(--gs), var(--gi);
  transition: transform 200ms var(--eo), box-shadow 200ms;
  animation: rise 380ms var(--eo) both;
  display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(26,57,72,0.13), 0 2px 6px rgba(26,57,72,0.06), inset 0 1px 0 rgba(255,255,255,0.96); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.card-name { font-family: var(--serif); font-size: 15.5px; font-weight: 500; color: var(--teal); line-height: 1.3; }
.card-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 100px; background: rgba(26,57,72,0.08); color: var(--teal2);
  border: 1px solid rgba(26,57,72,0.14); white-space: nowrap; }

.empty { text-align: center; padding: 60px 20px; color: var(--soft); }
.empty-icon { font-size: 36px; margin-bottom: 10px; }

.loadmore-wrap { display: flex; justify-content: center; margin-top: 28px; }
.loadmore {
  font-size: 13px; font-weight: 600; color: var(--teal); padding: 11px 26px; border-radius: 100px;
  border: 1.5px solid rgba(26,57,72,0.22); background: rgba(255,255,255,0.65); backdrop-filter: blur(8px);
  box-shadow: 0 2px 8px rgba(26,57,72,0.07), inset 0 1px 0 rgba(255,255,255,0.9);
  transition: transform 150ms var(--eo), background 150ms, color 150ms; cursor: pointer;
}
.loadmore:hover { background: var(--teal); color: var(--ivory); border-color: transparent; transform: translateY(-1px); }

@media (max-width: 880px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; max-height: none; }
  .grid { grid-template-columns: 1fr; }
  h1 { font-size: 28px; }
}
@media (min-width: 881px) and (max-width: 1180px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="scene"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<div class="nav-wrap">
  <div class="nav-pill">
    <div class="wordmark">PilotDesk<em>.</em></div>
    <div class="ntab on">Tools</div>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow"><span class="pdot"></span> Curated from Journalist's Toolbox</div>
    <h1>The Tool <em>Library</em></h1>
    <p class="sub">2,811 AI and digital tools for journalists — search by name, task, or browse by category.</p>
    <div class="searchbar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="search" type="text" placeholder="Search tools — try “transcribe”, “fact-check”, “OSINT”…" autocomplete="off">
      <button class="clr" id="clearBtn" title="Clear">✕</button>
    </div>
    <div class="statline" id="statline">Loading library…</div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sb-title">Categories</div>
      <div id="catList"></div>
    </aside>
    <main class="main-col">
      <div class="grid" id="grid"></div>
      <div class="empty" id="emptyState" style="display:none;">
        <div class="empty-icon">🔍</div>
        No tools match your search. Try a different term or category.
      </div>
      <div class="loadmore-wrap" id="loadmoreWrap" style="display:none;">
        <button class="loadmore" id="loadmoreBtn">Load more tools</button>
      </div>
    </main>
  </div>
</div>

<script>
const PAGE_SIZE = 60;
let ALL = [];
let CATS = [];
let activeCat = null;
let query = '';
let shown = PAGE_SIZE;

const grid = document.getElementById('grid');
const catList = document.getElementById('catList');
const statline = document.getElementById('statline');
const emptyState = document.getElementById('emptyState');
const loadmoreWrap = document.getElementById('loadmoreWrap');
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');

fetch('/tools/pilotdesk-taxonomy.json')
  .then(r => r.json())
  .then(data => {
    ALL = data.tools;
    buildCategories();
    render();
  })
  .catch(err => {
    statline.textContent = 'Could not load tool data.';
    console.error(err);
  });

function buildCategories() {
  const counts = {};
  ALL.forEach(t => {
    const cats = (t.categories && t.categories.length) ? t.categories : ['Uncategorized'];
    cats.forEach(c => { counts[c] = (counts[c] || 0) + 1; });
  });
  CATS = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  let html = `<div class="cat-item ${activeCat === null ? 'on' : ''}" data-cat="">
    <span>All tools</span><span class="n">${ALL.length}</span></div>`;
  CATS.forEach(([cat, n]) => {
    html += `<div class="cat-item" data-cat="${escapeAttr(cat)}">
      <span>${escapeHtml(cat)}</span><span class="n">${n}</span></div>`;
  });
  catList.innerHTML = html;

  catList.querySelectorAll('.cat-item').forEach(el => {
    el.addEventListener('click', () => {
      activeCat = el.getAttribute('data-cat') || null;
      shown = PAGE_SIZE;
      catList.querySelectorAll('.cat-item').forEach(x => x.classList.remove('on'));
      el.classList.add('on');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

function filteredTools() {
  let list = ALL;
  if (activeCat) {
    list = list.filter(t => (t.categories || []).includes(activeCat));
  }
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(t =>
      t.name.toLowerCase().includes(q) ||
      (t.description || '').toLowerCase().includes(q)
    );
  }
  return list;
}

function render() {
  const list = filteredTools();
  const visible = list.slice(0, shown);

  statline.innerHTML = query || activeCat
    ? `<b>${list.length}</b> tool${list.length === 1 ? '' : 's'} found`
    : `Browsing all <b>${ALL.length}</b> tools across ${CATS.length} categories`;

  if (list.length === 0) {
    grid.innerHTML = '';
    emptyState.style.display = 'block';
    loadmoreWrap.style.display = 'none';
    return;
  }
  emptyState.style.display = 'none';

  grid.innerHTML = visible.map(cardHtml).join('');
  loadmoreWrap.style.display = shown < list.length ? 'flex' : 'none';
}

function cardHtml(t) {
  const cats = (t.categories || []).slice(0, 2);
  const desc = t.description ? escapeHtml(t.description) : 'No description available.';
  return `<a class="card" href="${escapeAttr(t.url)}" target="_blank" rel="noopener noreferrer">
    <div class="card-name">${escapeHtml(t.name)}</div>
    <div class="card-desc">${desc}</div>
    <div class="card-tags">${cats.map(c => `<span class="tag">${escapeHtml(c)}</span>`).join('')}</div>
  </a>`;
}

document.getElementById('loadmoreBtn').addEventListener('click', () => {
  shown += PAGE_SIZE;
  render();
});

let debounceTimer;
searchInput.addEventListener('input', e => {
  clearTimeout(debounceTimer);
  const val = e.target.value;
  clearBtn.classList.toggle('show', val.length > 0);
  debounceTimer = setTimeout(() => {
    query = val.trim();
    shown = PAGE_SIZE;
    render();
  }, 180);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  query = '';
  shown = PAGE_SIZE;
  clearBtn.classList.remove('show');
  render();
  searchInput.focus();
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
</script>

</body>
</html>
