<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Admin — Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F8F7F6; --teal:#1A3948; --teal2:#24506A; --flame:#FF5400; --honey:#FFC047;
  --border:rgba(26,57,72,0.09); --muted:rgba(26,57,72,0.52); --soft:rgba(26,57,72,0.36);
  --glass:rgba(255,255,255,0.55); --glass-b:rgba(255,255,255,0.85);
  --gs:0 8px 32px rgba(26,57,72,0.10),0 1.5px 4px rgba(26,57,72,0.06);
  --gi:inset 0 1px 0 rgba(255,255,255,0.92),inset 0 -1px 0 rgba(26,57,72,0.03);
  --eo:cubic-bezier(0.25,0.46,0.45,0.94);
  --serif:'Lora',Georgia,serif; --sans:'Noto Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--teal);min-height:100vh;-webkit-font-smoothing:antialiased}
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#F0EFED}
.orb{position:absolute;border-radius:50%;filter:blur(90px)}
.o1{width:580px;height:460px;top:-120px;left:-100px;background:radial-gradient(ellipse,rgba(255,84,0,0.28) 0%,rgba(255,140,60,0.12) 45%,transparent 70%)}
.o2{width:460px;height:380px;top:35%;right:-120px;background:radial-gradient(ellipse,rgba(26,57,72,0.14) 0%,rgba(26,57,72,0.04) 55%,transparent 75%)}

.nav-wrap{position:sticky;top:0;z-index:50;display:flex;justify-content:center;padding:12px 24px 0}
.nav-pill{display:inline-flex;align-items:center;gap:2px;background:rgba(26,57,72,0.80);backdrop-filter:blur(28px) saturate(2);-webkit-backdrop-filter:blur(28px) saturate(2);border:1px solid rgba(255,255,255,0.12);border-radius:100px;padding:5px;box-shadow:0 8px 32px rgba(0,0,0,0.22),inset 0 1px 0 rgba(255,255,255,0.14)}
.wordmark{font-family:var(--serif);font-size:17px;color:rgba(248,247,246,0.92);padding:6px 16px 6px 12px;border-right:1px solid rgba(255,255,255,0.10);margin-right:4px}
.wordmark em{font-style:normal;color:var(--flame);font-weight:600}
.ntab{font-size:13px;font-weight:500;color:rgba(185,204,204,0.72);padding:7px 16px;border-radius:100px;cursor:pointer;text-decoration:none;transition:color 180ms,background 180ms}
.ntab:hover{color:rgba(248,247,246,0.95)}
.ntab.on{background:rgba(255,255,255,0.13);color:#fff}
.nav-sep{width:1px;height:20px;background:rgba(255,255,255,0.08);margin:0 2px}

.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:26px 24px 90px}
.hero{margin:18px 0 18px}
.hero h1{font-family:var(--serif);font-size:34px;font-weight:400;letter-spacing:-0.02em}
.hero p{font-size:13px;color:var(--muted);margin-top:6px;max-width:600px}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;color:var(--soft);display:flex;align-items:center;gap:7px;margin-bottom:10px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--flame)}

.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
@media(max-width:1080px){.grid{grid-template-columns:1fr}}

.card{border-radius:18px;padding:18px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border:1px solid var(--glass-b);box-shadow:var(--gs),var(--gi)}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.chead h2{font-family:var(--serif);font-size:17px;font-weight:400;white-space:nowrap}
.rule{flex:1;height:1px;background:var(--border)}
.uchip{font-size:11px;font-weight:700;color:var(--flame);background:rgba(255,84,0,0.08);border:1px solid rgba(255,84,0,0.18);padding:3px 11px;border-radius:100px;white-space:nowrap}
.uchip.gray{color:var(--muted);background:rgba(26,57,72,0.05);border-color:var(--border)}

.tok-groups{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.tok-g-label{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.tok-row{display:flex;flex-wrap:wrap;gap:6px}
.tok{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;font-weight:600;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,0.65);border:1px solid var(--border);color:var(--teal2);cursor:pointer;transition:all 150ms}
.tok:hover{background:var(--teal);color:var(--ivory);border-color:var(--teal);transform:translateY(-1px)}
.tok.cond{border-style:dashed;color:var(--flame);border-color:rgba(255,84,0,.3)}
.tok.cond:hover{background:var(--flame);border-color:var(--flame)}

textarea#tpl{width:100%;min-height:480px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;line-height:1.7;color:var(--teal);background:rgba(255,255,255,0.55);border:1px solid var(--border);border-radius:14px;padding:16px;outline:none;resize:vertical;transition:border-color 150ms}
textarea#tpl:focus{border-color:rgba(255,84,0,0.35)}

.footbar{display:flex;align-items:center;gap:10px;margin-top:12px}
.ghost{font-size:12px;font-weight:600;color:var(--teal);padding:8px 16px;border-radius:100px;border:1.5px solid rgba(26,57,72,0.18);background:rgba(255,255,255,0.65);cursor:pointer;transition:all 150ms var(--eo)}
.ghost:hover{background:var(--teal);color:var(--ivory);border-color:transparent}
.btn-flame{font-size:13px;font-weight:600;color:#fff;background:var(--flame);border:none;padding:9px 20px;border-radius:100px;cursor:pointer;box-shadow:0 2px 10px rgba(255,84,0,.42);transition:transform 150ms var(--eo)}
.btn-flame:hover{transform:translateY(-1px)}
.savestate{font-size:11.5px;color:var(--soft);margin-left:auto}
.savestate.dirty{color:var(--flame);font-weight:600}

.scenarios{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sc{padding:6px 14px;border-radius:100px;font-size:11.5px;font-weight:500;border:1px solid var(--border);background:rgba(255,255,255,0.60);color:var(--muted);cursor:pointer;transition:all 150ms}
.sc.on{background:var(--teal);color:var(--ivory);border-color:var(--teal)}
.sc:hover:not(.on){background:rgba(255,255,255,0.9)}

.preview-wrap{position:sticky;top:78px}
pre#preview{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;line-height:1.65;color:var(--teal2);max-height:560px;overflow:auto;background:rgba(255,255,255,0.5);border-radius:14px;padding:16px;border:1px solid var(--border)}
.meta-line{font-size:11px;color:var(--soft);margin-top:9px;display:flex;gap:12px;flex-wrap:wrap}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;background:rgba(26,57,72,0.92);backdrop-filter:blur(20px);color:var(--ivory);font-size:12.5px;font-weight:500;padding:10px 20px;border-radius:100px;box-shadow:0 8px 32px rgba(0,0,0,0.24);z-index:99;transition:all 280ms var(--eo)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="scene"><div class="orb o1"></div><div class="orb o2"></div></div>

<div class="nav-wrap">
  <div class="nav-pill">
    <div class="wordmark">Desk<em>.</em></div>
    <a href="../" class="ntab">Search Intelligence</a>
    <div class="ntab on">Prompt Admin</div>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow"><span class="dot"></span> Template editor</div>
    <h1>Headline prompt — design</h1>
    <p>Edit the structure once here. The live page reads this template every time it assembles a prompt — no frontend changes needed.</p>
  </div>

  <div class="grid">

    <!-- EDITOR -->
    <div class="card">
      <div class="chead"><h2>Template</h2><div class="rule"></div><span class="uchip gray" id="srcChip">default</span></div>

      <div class="tok-groups" id="tokGroups"></div>

      <textarea id="tpl" spellcheck="false"></textarea>

      <div class="footbar">
        <button class="ghost" id="btnReset">↺ Reset to default</button>
        <button class="ghost" id="btnCopyTpl">⧉ Copy template</button>
        <span class="savestate" id="saveState">saved</span>
        <button class="btn-flame" id="btnSave">Save template</button>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="preview-wrap">
      <div class="card">
        <div class="chead"><h2>Preview</h2><div class="rule"></div><span class="uchip" id="lenChip">— chars</span></div>
        <div class="scenarios" id="scenarios"></div>
        <pre id="preview"></pre>
        <div class="meta-line" id="metaLine"></div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../prompt-engine.js"></script>
<script>
const $ = id => document.getElementById(id);
let toastT;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- Sample scenarios for the preview ---------- */
const SAMPLE_ARTICLE = `دولت ایران روز سه‌شنبه اعلام کرد که مذاکرات هسته‌ای با نمایندگان آمریکا در دور تازه‌ای در وین از سر گرفته خواهد شد. به گفته یک منبع نزدیک به وزارت خارجه، تمرکز اصلی این دور بر تضمین‌های مربوط به راستی‌آزمایی و رفع بخشی از تحریم‌های بانکی خواهد بود.

ناظران می‌گویند فاصله میان دو طرف در روزهای اخیر کاهش یافته، اما هیچ تضمینی برای دستیابی به توافق نهایی در این دور وجود ندارد. یک دیپلمات اروپایی که نخواست نامش فاش شود گفت که «پیشرفت محسوس است، اما جزئیات فنی همچنان محل اختلاف باقی مانده‌اند.»`;

const SAMPLES = {
  full: {
    SITE:'radiofarda.com', DAYS:28,
    HEADLINE:'ایران و آمریکا مذاکرات هسته‌ای را از سر می‌گیرند',
    ARTICLE:SAMPLE_ARTICLE, ARTICLE_WORDCOUNT:96,
    QUERY_TABLE:[
      'مذاکرات هسته ای ایران | 4210 | 18400 | 22.9% | 2.1 | /a/nuclear-talks-vienna/33800001.html',
      'توافق هسته ای ایران و آمریکا | 1875 | 9200 | 20.4% | 3.4 | /a/nuclear-talks-vienna/33800001.html',
      'تحریم بانکی ایران | 640 | 12300 | 5.2% | 8.7 | /a/bank-sanctions-2025/33750002.html'
    ].join('\n'),
    QUERY_COUNT:3,
    OPPORTUNITY:'  · تحریم بانکی ایران — pos 8.7, 12300 impressions, only 640 clicks',
    CANNIBALIZATION:'  · "مذاکرات هسته ای ایران" → already ranked (pos 2.1) by: /a/nuclear-talks-vienna/33800001.html',
    NO_QUERY_DATA:'',
    DISCOVER:'· "گفتگوی مقامات ایران و آمریکا در وین آغاز شد" — 91200 clicks, 640000 impressions, 14.2% CTR\n· "واکنش‌ها به دور تازه مذاکرات هسته‌ای" — 34500 clicks, 210000 impressions, 16.4% CTR',
    DISCOVER_COUNT:2, DISCOVER_WINDOW_LABEL:'last 3 days'
  },
  breaking: {
    SITE:'radiofarda.com', DAYS:28,
    HEADLINE:'', ARTICLE:SAMPLE_ARTICLE, ARTICLE_WORDCOUNT:96,
    QUERY_TABLE:'', QUERY_COUNT:0, OPPORTUNITY:'', CANNIBALIZATION:'', NO_QUERY_DATA:'1',
    DISCOVER:'', DISCOVER_COUNT:0, DISCOVER_WINDOW_LABEL:'last 3 days'
  },
  clean: {
    SITE:'radiofarda.com', DAYS:28,
    HEADLINE:'گزارش ویژه از قطعی برق در تهران',
    ARTICLE:SAMPLE_ARTICLE, ARTICLE_WORDCOUNT:96,
    QUERY_TABLE:'قطعی برق تهران | 2100 | 9800 | 21.4% | 1.8 | /a/tehran-blackout-report/33810003.html',
    QUERY_COUNT:1, OPPORTUNITY:'', CANNIBALIZATION:'', NO_QUERY_DATA:'',
    DISCOVER:'', DISCOVER_COUNT:0, DISCOVER_WINDOW_LABEL:'this week'
  }
};
const SCENARIOS = [
  { id:'full', label:'Full data' },
  { id:'breaking', label:'Breaking — no search history' },
  { id:'clean', label:'Clean — no cannibalization' }
];
let activeScenario = 'full';

/* ---------- Token palette ---------- */
function buildTokenUI(){
  const groups = {};
  PromptEngine.TOKENS.forEach(t => { (groups[t.group] = groups[t.group]||[]).push(t); });
  $('tokGroups').innerHTML = Object.keys(groups).map(g => `
    <div>
      <div class="tok-g-label">${g}</div>
      <div class="tok-row">
        ${groups[g].map(t => `<span class="tok${t.cond?' cond':''}" data-key="${t.key}" data-cond="${t.cond}" title="${t.label}${t.cond?' — click for plain token, shift-click to insert as a conditional block':''}">{{${t.key}}}</span>`).join('')}
      </div>
    </div>`).join('');
  $('tokGroups').addEventListener('click', e => {
    const el = e.target.closest('.tok'); if (!el) return;
    const key = el.dataset.key;
    const asCond = e.shiftKey && el.dataset.cond === 'true';
    insertAtCursor(asCond ? `{{#IF:${key}}}\n\n{{/IF}}` : `{{${key}}}`, asCond);
  });
}
function insertAtCursor(text, placeMiddle){
  const ta = $('tpl');
  const start = ta.selectionStart, end = ta.selectionEnd;
  ta.value = ta.value.slice(0,start) + text + ta.value.slice(end);
  const mid = placeMiddle ? start + text.indexOf('\n\n') + 1 : start + text.length;
  ta.focus(); ta.setSelectionRange(mid, mid);
  onTplChange();
}

/* ---------- Scenario chips ---------- */
function buildScenarioUI(){
  $('scenarios').innerHTML = SCENARIOS.map(s =>
    `<div class="sc ${s.id===activeScenario?'on':''}" data-sc="${s.id}">${s.label}</div>`).join('');
  $('scenarios').addEventListener('click', e => {
    const el = e.target.closest('.sc'); if (!el) return;
    activeScenario = el.dataset.sc;
    document.querySelectorAll('.sc').forEach(c=>c.classList.toggle('on', c.dataset.sc===activeScenario));
    renderPreview();
  });
}

/* ---------- Preview + save state ---------- */
let dirty = false;
function renderPreview(){
  const p = PromptEngine.assemble($('tpl').value, SAMPLES[activeScenario]);
  $('preview').textContent = p;
  $('lenChip').textContent = p.length.toLocaleString()+' chars';
  $('metaLine').textContent = `~${Math.round(p.length/4).toLocaleString()} tokens · scenario: ${SCENARIOS.find(s=>s.id===activeScenario).label}`;
}
function onTplChange(){
  dirty = true;
  $('saveState').textContent = 'unsaved changes';
  $('saveState').classList.add('dirty');
  renderPreview();
}
$('tpl').addEventListener('input', onTplChange);

$('btnSave').addEventListener('click', () => {
  PromptEngine.saveTemplate($('tpl').value);
  dirty = false;
  $('saveState').textContent = 'saved';
  $('saveState').classList.remove('dirty');
  $('srcChip').textContent = 'customized'; $('srcChip').classList.remove('gray');
  toast('Template saved — live on Search Intelligence now');
});
$('btnReset').addEventListener('click', () => {
  if (!confirm('Reset to the default template? Unsaved edits will be lost.')) return;
  PromptEngine.resetTemplate();
  $('tpl').value = PromptEngine.DEFAULT_TEMPLATE;
  dirty = false; $('saveState').textContent='saved'; $('saveState').classList.remove('dirty');
  $('srcChip').textContent = 'default'; $('srcChip').classList.add('gray');
  renderPreview(); toast('Reset to default');
});
$('btnCopyTpl').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('tpl').value); toast('Template copied'); }
  catch(e){ toast('Copy blocked'); }
});
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue=''; } });

/* ---------- Boot ---------- */
buildTokenUI();
buildScenarioUI();
$('tpl').value = PromptEngine.loadTemplate();
$('srcChip').textContent = PromptEngine.isCustomized() ? 'customized' : 'default';
$('srcChip').classList.toggle('gray', !PromptEngine.isCustomized());
renderPreview();
</script>
</body>
</html>
