<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Noto+Sans:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --flame:#FF5400;
  --teal:#1A3948; --teal2:#24506A; --honey:#FFC047; --stone:#B9CCCC; --ivory:#F8F7F6;
  --glass:rgba(255,255,255,0.16);
  --glass-filter: blur(38px) saturate(2.4) brightness(1.10);
  --lt-1:#FFFFFF; --lt-2:rgba(255,255,255,0.92); --lt-3:rgba(255,255,255,0.74);
  --border:rgba(255,255,255,0.16);
  --ts:    0 1px 2px rgba(4,12,16,0.85), 0 2px 10px rgba(4,12,16,0.55);
  --ts-lg: 0 1px 3px rgba(4,12,16,0.90), 0 3px 16px rgba(4,12,16,0.60), 0 1px 1px rgba(4,12,16,0.70);
  --rim: inset 0 0 0 1px rgba(255,255,255,0.14), inset 0 1.5px 2px rgba(255,255,255,0.34),
    inset 0 -2px 3px rgba(4,12,16,0.20), inset 0 0 32px rgba(255,255,255,0.045);
  --rim-sm: inset 0 0 0 1px rgba(255,255,255,0.11), inset 0 1px 1.5px rgba(255,255,255,0.26),
    inset 0 -1.5px 2px rgba(4,12,16,0.18);
  --ambient: 0 1px 2px rgba(6,20,28,0.44), 0 10px 30px rgba(6,20,28,0.40), 0 30px 70px rgba(6,20,28,0.34);
  --ambient-lg: 0 1px 2px rgba(6,20,28,0.46), 0 14px 36px rgba(6,20,28,0.40), 0 44px 90px rgba(6,20,28,0.38);
  --ambient-hi: 0 1px 2px rgba(6,20,28,0.50), 0 20px 46px rgba(6,20,28,0.44), 0 56px 110px rgba(6,20,28,0.42);
  --chip:rgba(255,255,255,0.10); --chip-hover:rgba(255,255,255,0.18);
  --sunk: inset 0 3px 6px rgba(4,12,16,0.30), inset 0 1px 2px rgba(4,12,16,0.20),
    inset 0 -1px 2px rgba(255,255,255,0.12), inset 0 0 0 1px rgba(255,255,255,0.10);
  --eo:cubic-bezier(0.25,0.46,0.45,0.94); --serif:'Lora',Georgia,serif; --sans:'Noto Sans',system-ui,sans-serif;
}
html[dir="rtl"]{ --serif:'Vazirmatn','Noto Sans',sans-serif; --sans:'Vazirmatn','Noto Sans',sans-serif; }
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{font-family:var(--sans);color:var(--lt-2);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:linear-gradient(160deg,#0F1622 0%,#0B1016 45%,#0C0E14 75%,#120E18 100%)}
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(160deg,#0F1622 0%,#0B1016 45%,#0C0E14 75%,#120E18 100%)}
.scene::before{content:'';position:absolute;inset:0;
  background-image:url('https://images.pexels.com/photos/10464443/pexels-photo-10464443.jpeg');
  background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:0.55;filter:saturate(1.05) contrast(1.02)}
.scene::after{content:'';position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(15,22,34,0.72) 0%,rgba(11,16,22,0.78) 45%,rgba(12,14,20,0.82) 75%,rgba(18,14,24,0.86) 100%)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 24px 70px}

/* ===== NAV ===== */
.nav-wrap{position:sticky;top:0;z-index:50;display:flex;justify-content:center;padding:16px 24px 0;pointer-events:none}
.nav-pill{position:relative;display:inline-flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center;
  background:var(--glass);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  border-radius:100px;padding:5px;box-shadow:var(--ambient),var(--rim);pointer-events:all}
.wordmark{font-family:var(--serif);font-size:17px;color:var(--lt-1);text-shadow:var(--ts);
  padding:6px 16px 6px 12px;border-right:1px solid var(--border);margin-right:4px;white-space:nowrap;
  position:relative;z-index:1}
.wordmark em{font-style:normal;color:#FFB07A;font-weight:600}
.nav-highlight{position:absolute;top:5px;left:0;height:calc(100% - 10px);width:0;border-radius:100px;
  background:rgba(255,255,255,0.09);box-shadow:var(--rim-sm);pointer-events:none;opacity:0;z-index:0;
  transition:left 150ms cubic-bezier(0.22,1,0.36,1),width 150ms cubic-bezier(0.22,1,0.36,1),opacity 100ms ease-out}
.nav-highlight.show{opacity:1}
.ntab{position:relative;z-index:1;font-size:13px;font-weight:500;color:var(--lt-3);text-shadow:var(--ts);padding:7px 16px;border-radius:100px;
  cursor:pointer;text-decoration:none;transition:color 110ms ease-out;white-space:nowrap;display:inline-block}
.ntab:hover{color:var(--lt-1)}
.nav-sep{position:relative;z-index:1;width:1px;height:20px;background:var(--border);margin:0 2px}
.langtoggle{display:flex;gap:2px;margin-left:2px;position:relative;z-index:1}
.lt-opt{font-size:11px;font-weight:600;color:var(--lt-3);text-shadow:var(--ts);padding:5px 9px;border-radius:100px;cursor:pointer;transition:background 110ms ease-out,color 110ms ease-out}
.lt-opt:hover{color:var(--lt-1)}
.lt-opt.on{background:rgba(255,255,255,0.82);color:#0E2531;text-shadow:none;box-shadow:var(--rim-sm)}

.profile-wrap{position:relative;z-index:1}
.profile-trigger{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:13px;font-weight:500;
  color:var(--lt-3);text-shadow:var(--ts);padding:5px 12px 5px 6px;border-radius:100px;cursor:pointer;
  border:none;background:transparent;transition:color 110ms ease-out,background 110ms ease-out;white-space:nowrap}
.profile-trigger:hover{color:var(--lt-1);background:rgba(255,255,255,0.08)}
.profile-wrap.open .profile-trigger{background:rgba(255,255,255,0.10);color:var(--lt-1)}
.profile-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:10.5px;font-weight:700;color:#fff;flex-shrink:0;
  background:linear-gradient(180deg,#FF8A45 0%,var(--flame) 100%);box-shadow:var(--rim-sm)}
.profile-name{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-chev{font-size:8px;color:var(--lt-3);transition:transform 150ms cubic-bezier(0.22,1,0.36,1)}
.profile-wrap.open .profile-chev{transform:rotate(180deg)}
.profile-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:200px;border-radius:18px;padding:8px;
  background:var(--glass);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  box-shadow:var(--ambient-hi),var(--rim);z-index:60;
  opacity:0;pointer-events:none;transform:translateY(-6px) scale(0.98);
  transition:opacity 140ms ease-out,transform 140ms cubic-bezier(0.22,1,0.36,1)}
html[dir="rtl"] .profile-menu{right:auto;left:0}
.profile-wrap.open .profile-menu{opacity:1;pointer-events:auto;transform:none}
.profile-menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:12px;
  border:none;background:transparent;cursor:pointer;text-decoration:none;text-align:left;
  font-family:var(--sans);transition:background 110ms ease-out}
html[dir="rtl"] .profile-menu-item{text-align:right}
.profile-menu-item:hover{background:rgba(255,255,255,0.08)}
.profile-menu-item.danger:hover{background:rgba(255,84,0,0.14)}
.pmi-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.pmi-title{display:block;font-size:12.5px;font-weight:600;color:var(--lt-2);text-shadow:var(--ts)}

/* ===== HERO ===== */
.hero{padding:46px 0 24px;max-width:660px}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--lt-3);
  text-shadow:var(--ts);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--flame);box-shadow:0 0 10px rgba(255,84,0,0.90)}
.hero h1{font-family:var(--serif);font-size:46px;font-weight:400;letter-spacing:-0.02em;line-height:1.1;
  margin-bottom:12px;color:var(--lt-1);text-shadow:var(--ts-lg)}
.hero p{font-family:var(--serif);font-size:15px;color:var(--lt-3);text-shadow:var(--ts);line-height:1.6;max-width:540px}

/* ===== TOOLBAR ===== */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.chead-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.20),transparent)}
.ghost-sm{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--lt-1);text-shadow:var(--ts);
  padding:8px 16px;border-radius:100px;border:none;cursor:pointer;
  background:rgba(255,255,255,0.10);box-shadow:var(--ambient),var(--rim-sm);
  transition:transform 120ms cubic-bezier(0.22,1,0.36,1),background 120ms ease-out;white-space:nowrap}
.ghost-sm:hover{background:rgba(255,120,50,0.16);transform:translateY(-2px)}

/* ===== TOOL CARDS ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tcard{position:relative;border-radius:22px;padding:22px;background:var(--glass);
  backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  box-shadow:var(--ambient-lg),var(--rim);text-decoration:none;color:inherit;display:block;
  transition:transform 130ms cubic-bezier(0.22,1,0.36,1),box-shadow 130ms ease-out;
  animation:rise 420ms var(--eo) both}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--ambient-hi),var(--rim)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.tcard-icon{font-size:26px;margin-bottom:14px;display:block}
.tcard-name{font-family:var(--serif);font-size:19px;color:var(--lt-1);text-shadow:var(--ts-lg);margin-bottom:8px}
.tcard-desc{font-size:12.5px;color:var(--lt-3);text-shadow:var(--ts);line-height:1.6;margin-bottom:14px}
.tcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tcard-cat{font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--lt-3);
  background:rgba(255,255,255,0.08);padding:4px 10px;border-radius:100px}
.tcard-go{font-size:12px;font-weight:600;color:#FFB07A}
.empty{font-size:12.5px;color:var(--lt-3);text-shadow:var(--ts);line-height:1.6;font-family:var(--serif);
  padding:40px 0;text-align:center}
.errbox{font-size:12px;color:#FFD9C2;background:rgba(255,84,0,0.18);box-shadow:var(--rim-sm);
  padding:11px 14px;border-radius:12px;line-height:1.5;margin-bottom:14px}
.skel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.skel-card{height:180px;border-radius:22px;background:var(--chip);box-shadow:var(--rim-sm);
  animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}

/* ===== LOGIN GATE ===== */
.hide{display:none!important}
.login-gate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0F1622 0%,#0B1016 45%,#0C0E14 75%,#120E18 100%);padding:20px}
.login-card{width:100%;max-width:380px;border-radius:26px;padding:36px 32px;
  background:var(--glass);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  border:1px solid var(--border);box-shadow:var(--ambient-lg),var(--rim);text-align:center}
.login-wordmark{font-family:var(--serif);font-size:20px;color:var(--lt-1);text-shadow:var(--ts-lg);margin-bottom:28px}
.login-title{font-family:var(--serif);font-size:23px;color:var(--lt-1);text-shadow:var(--ts-lg);margin-bottom:6px}
.login-sub{font-size:12px;color:var(--lt-3);text-shadow:var(--ts);margin-bottom:24px}
.login-field{margin-bottom:14px;text-align:left}
html[dir="rtl"] .login-field{text-align:right}
.login-field label{display:block;font-size:11px;color:var(--lt-3);text-shadow:var(--ts);margin-bottom:6px;padding-left:4px}
.login-field input{width:100%;font-family:var(--sans);font-size:13.5px;color:var(--lt-1);
  padding:11px 15px;border-radius:14px;border:none;outline:none;
  background:var(--chip);box-shadow:var(--rim-sm);transition:background 130ms ease-out,box-shadow 130ms ease-out}
.login-field input::placeholder{color:rgba(255,255,255,0.4)}
.login-field input:focus{background:var(--chip-hover);box-shadow:var(--rim-sm),inset 0 0 0 1.5px rgba(255,150,80,0.45)}
.btn-flame{font-family:var(--sans);font-size:13px;font-weight:600;color:#fff;padding:9px 21px;border-radius:100px;border:none;cursor:pointer;
  background:linear-gradient(180deg,#FF8A45 0%,var(--flame) 52%,#DC4400 100%);
  box-shadow:0 1px 2px rgba(120,36,0,0.50),0 6px 16px rgba(255,84,0,0.52),0 18px 40px rgba(255,84,0,0.30),
    inset 0 2px 0 rgba(255,255,255,0.62),inset 0 -2px 2px rgba(120,34,0,0.44),inset 0 0 0 1px rgba(255,140,80,0.50);
  transition:transform 120ms cubic-bezier(0.22,1,0.36,1),box-shadow 120ms ease-out;white-space:nowrap}
.btn-flame:hover{transform:translateY(-1.5px) scale(1.02)}
.btn-flame:disabled{opacity:.45;cursor:default;transform:none}
.login-submit{width:100%;margin-top:10px}
.login-error{font-size:11.5px;color:#FF8A5C;background:rgba(255,84,0,0.10);border:1px solid rgba(255,84,0,0.22);
  border-radius:12px;padding:9px 12px;margin-bottom:12px;display:none;text-align:left}
.login-error.show{display:block}

/* ===== ADMIN MANAGE MODAL ===== */
.modal-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:flex-start;justify-content:center;
  background:rgba(5,8,13,0.64);backdrop-filter:blur(13px);padding:56px 20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal-card{width:100%;max-width:720px;border-radius:26px;padding:26px 28px;
  background:var(--glass);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  box-shadow:var(--ambient-hi),var(--rim)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h2{font-family:var(--serif);font-size:20px;font-weight:400;color:var(--lt-1);text-shadow:var(--ts-lg)}
.trow{border-radius:16px;background:var(--chip);box-shadow:var(--rim-sm);padding:14px;margin-bottom:10px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.trow input,.trow select{font-family:var(--sans);font-size:12.5px;color:var(--lt-1);
  padding:8px 12px;border-radius:10px;border:none;outline:none;background:rgba(255,255,255,0.08);
  box-shadow:var(--rim-sm);min-width:0}
.trow .f-name{flex:1;min-width:110px}
.trow .f-path{flex:1.4;min-width:160px}
.trow .f-desc{flex-basis:100%;min-width:0}
.trow-actions{display:flex;gap:6px;margin-left:auto}
.trow-actions .ghost-sm{padding:6px 12px;font-size:11px}
.new-trow{border-radius:16px;border:1.5px dashed rgba(255,255,255,0.20);padding:14px;margin-bottom:14px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.modal-toast{font-size:11.5px;color:var(--lt-3);margin-top:4px}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(14px);z-index:300;
  padding:12px 20px;border-radius:100px;font-size:13px;font-weight:500;color:var(--lt-1);text-shadow:var(--ts);
  background:var(--glass);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  box-shadow:var(--ambient-hi),var(--rim);
  opacity:0;pointer-events:none;transition:opacity 200ms ease-out,transform 200ms var(--eo);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:640px){ .hero h1{font-size:32px} .grid,.skel-grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="scene"></div>

<div class="nav-wrap">
  <div class="nav-pill">
    <span class="nav-highlight" id="navHighlight"></span>
    <div class="wordmark">Desk<em>.</em></div>
    <div class="nav-sep"></div>
    <div class="profile-wrap" id="profileWrap">
      <button class="profile-trigger" id="profileTrigger" type="button">
        <span class="profile-avatar" id="profileAvatar">–</span>
        <span class="profile-name" id="profileName">–</span>
        <span class="profile-chev">▾</span>
      </button>
      <div class="profile-menu" id="profileMenu">
        <button class="profile-menu-item danger" id="logoutBtn" type="button">
          <span class="pmi-icon">⏻</span>
          <span class="pmi-title" data-i18n="nav.logout">Sign out</span>
        </button>
      </div>
    </div>
    <div class="nav-sep"></div>
    <div class="langtoggle" id="langToggle">
      <div class="lt-opt on" data-lang="en">EN</div>
      <div class="lt-opt" data-lang="fa">فا</div>
    </div>
  </div>
</div>

<div class="login-gate" id="loginGate">
  <div class="login-card">
    <div class="login-wordmark">Desk<em>.</em></div>
    <div class="login-title" data-i18n="login.title">Sign in</div>
    <div class="login-sub" data-i18n="login.sub">Newsroom AI tools — Radio Farda</div>
    <div class="login-error" id="loginError"></div>
    <div class="login-field">
      <label data-i18n="login.username">Username</label>
      <input id="loginUsername" autocomplete="username" data-i18n-ph="login.usernamePh" placeholder="e.g. user1">
    </div>
    <div class="login-field">
      <label data-i18n="login.password">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" data-i18n-ph="login.passwordPh" placeholder="••••••••">
    </div>
    <button class="btn-flame login-submit" id="loginSubmit" data-i18n="login.submit">Sign in →</button>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow"><span class="pdot"></span> <span data-i18n="hub.eyebrow">Newsroom AI tools — Radio Farda</span></div>
    <h1 data-i18n="hub.title">Desk</h1>
    <p data-i18n="hub.sub">Every AI tool built for this newsroom, in one place. Pick one to get started.</p>
  </div>

  <div class="toolbar">
    <div class="chead-line"></div>
    <button class="ghost-sm hide" id="manageBtn" data-i18n="hub.manage">⚙ Manage tools</button>
  </div>

  <div id="hubState">
    <div class="skel-grid"><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div></div>
  </div>
</div>

<!-- ===== Admin: manage tools modal ===== -->
<div class="modal-overlay" id="manageModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 data-i18n="hub.manageTitle">Manage tools</h2>
      <button class="ghost-sm" id="manageClose" data-i18n="hub.close">Close</button>
    </div>
    <div id="manageError"></div>
    <div class="new-trow" id="newToolRow">
      <input class="f-name" id="ntName" data-i18n-ph="hub.fName" placeholder="Name">
      <input class="f-path" id="ntPath" data-i18n-ph="hub.fPath" placeholder="/desk/...">
      <input id="ntIcon" style="width:56px;text-align:center" data-i18n-ph="hub.fIcon" placeholder="🔍" maxlength="4">
      <select id="ntService">
        <option value="both" data-i18n="hub.svcBoth">Both services</option>
        <option value="fa" data-i18n="hub.svcFa">Farsi only</option>
        <option value="en" data-i18n="hub.svcEn">English only</option>
      </select>
      <select id="ntStatus">
        <option value="live" data-i18n="hub.stLive">Live</option>
        <option value="draft" data-i18n="hub.stDraft">Draft</option>
      </select>
      <input class="f-desc" id="ntDesc" data-i18n-ph="hub.fDesc" placeholder="One line description">
      <button class="btn-flame" id="ntCreate" style="padding:8px 18px;font-size:12px" data-i18n="hub.add">＋ Add</button>
    </div>
    <div id="toolsList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/desk/search-intelligence/auth-engine.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ==================== i18n ==================== */
const I18N = {
en: {
  'nav.logout':'⏻ Sign out',
  'login.title':'Sign in', 'login.sub':'Newsroom AI tools — Radio Farda',
  'login.username':'Username', 'login.usernamePh':'e.g. user1',
  'login.password':'Password', 'login.passwordPh':'••••••••',
  'login.submit':'Sign in →', 'login.submitting':'Signing in…',
  'login.error':'Invalid username or password', 'login.fillBoth':'Enter a username and password',
  'hub.eyebrow':'Newsroom AI tools — Radio Farda',
  'hub.title':'Desk',
  'hub.sub':'Every AI tool built for this newsroom, in one place. Pick one to get started.',
  'hub.manage':'⚙ Manage tools', 'hub.manageTitle':'Manage tools', 'hub.close':'Close',

let LANG = localStorage.getItem('desk.si.lang') || 'en';
function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{'+k+'}').join(vars[k]); });
  return s;
}
function applyStaticI18n(){
  document.documentElement.dir = LANG==='fa' ? 'rtl' : 'ltr';
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('.lt-opt').forEach(el => el.classList.toggle('on', el.dataset.lang===LANG));
}
function setLang(l){
  LANG = l;
  try{ localStorage.setItem('desk.si.lang', l); }catch(e){}
  applyStaticI18n();
  renderGrid();
}
document.getElementById('langToggle').addEventListener('click', e=>{
  const el = e.target.closest('.lt-opt'); if(!el) return;
  setLang(el.dataset.lang);
});
applyStaticI18n();

/* ==================== toast ==================== */
let toastTimer;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ==================== nav sliding highlight ==================== */
(function initNavHighlight(){
  const pill = document.querySelector('.nav-pill');
  const glow = $('navHighlight');
  const targets = pill.querySelectorAll('.ntab, .profile-trigger');
  function moveTo(el){
    const pr = pill.getBoundingClientRect(), r = el.getBoundingClientRect();
    glow.style.left = (r.left - pr.left) + 'px';
    glow.style.width = r.width + 'px';
    glow.classList.add('show');
  }
  targets.forEach(el => el.addEventListener('mouseenter', () => moveTo(el)));
  pill.addEventListener('mouseleave', () => glow.classList.remove('show'));
})();

/* ==================== profile dropdown ==================== */
function renderProfile(session){
  const initials = String(session.username||'?').trim().slice(0,2).toUpperCase();
  $('profileAvatar').textContent = initials;
  $('profileName').textContent = session.username;
}
$('profileTrigger').addEventListener('click', e=>{ e.stopPropagation(); $('profileWrap').classList.toggle('open'); });
document.addEventListener('click', e=>{ if (!$('profileWrap').contains(e.target)) $('profileWrap').classList.remove('open'); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ $('profileWrap').classList.remove('open'); $('manageModal').classList.remove('show'); } });
$('logoutBtn').addEventListener('click', ()=>{ AuthEngine.logout(); location.reload(); });

/* ==================== auth gate ==================== */
function showLoginGate(){ $('loginGate').classList.remove('hide'); }
function hideLoginGate(){ $('loginGate').classList.add('hide'); }
function showLoginError(msg){ const el=$('loginError'); el.textContent=msg; el.classList.add('show'); }
function clearLoginError(){ $('loginError').classList.remove('show'); }
async function doLogin(){
  const u = $('loginUsername').value.trim(), p = $('loginPassword').value;
  clearLoginError();
  if (!u || !p) return showLoginError(t('login.fillBoth'));
  $('loginSubmit').disabled = true; $('loginSubmit').textContent = t('login.submitting');
  try{
    const res = await AuthEngine.login(u, p);
    if (!res.ok) return showLoginError(res.error || t('login.error'));
    $('loginPassword').value = '';
    hideLoginGate();
    startApp(res.session);
  }catch(e){ showLoginError(String((e&&e.message)||e)); }
  finally{ $('loginSubmit').disabled = false; $('loginSubmit').textContent = t('login.submit'); }
}
$('loginSubmit').addEventListener('click', doLogin);
$('loginUsername').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
$('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

/* ==================== tool grid ==================== */
let TOOLS = [], SESSION = null;

function cardHtml(tool){
  return `
  <a class="tcard" href="${esc(tool.path)}">
    <span class="tcard-icon">${esc(tool.icon || '◆')}</span>
    <div class="tcard-name">${esc(tool.name)}</div>
    ${tool.description ? `<div class="tcard-desc">${esc(tool.description)}</div>` : ''}
    <div class="tcard-foot">
      <span class="tcard-cat">${esc(tool.category || 'general')}</span>
      <span class="tcard-go">${esc(t('hub.open'))}</span>
    </div>
  </a>`;
}
function renderGrid(){
  const state = $('hubState');
  if (!TOOLS.length){ state.innerHTML = `<div class="empty">${t('hub.empty')}</div>`; return; }
  state.innerHTML = `<div class="grid">${TOOLS.map(cardHtml).join('')}</div>`;
}
async function loadTools(){
  try{
    const data = await AuthEngine.authedPost({ mode:'listTools' });
    if (!data.ok){
      if (data.authError) return showLoginGate();
      throw new Error(data.error || 'Unknown error');
    }
    TOOLS = data.tools || [];
    renderGrid();
  }catch(e){
    $('hubState').innerHTML = `<div class="errbox">${esc(t('hub.loadFailed',{msg:e.message||String(e)}))}</div>`;
  }
}

/* ==================== admin: manage tools ==================== */
let ADMIN_TOOLS = [];
function toolRowHtml(tool){
  return `
  <div class="trow" data-id="${tool.id}">
    <input class="f-name" data-field="name" value="${esc(tool.name)}">
    <input class="f-path" data-field="path" value="${esc(tool.path)}">
    <input data-field="icon" style="width:56px;text-align:center" value="${esc(tool.icon||'')}" maxlength="4">
    <select data-field="service">
      <option value="both" ${tool.service==='both'?'selected':''}>${t('hub.svcBoth')}</option>
      <option value="fa" ${tool.service==='fa'?'selected':''}>${t('hub.svcFa')}</option>
      <option value="en" ${tool.service==='en'?'selected':''}>${t('hub.svcEn')}</option>
    </select>
    <select data-field="status">
      <option value="live" ${tool.status==='live'?'selected':''}>${t('hub.stLive')}</option>
      <option value="draft" ${tool.status==='draft'?'selected':''}>${t('hub.stDraft')}</option>
      <option value="archived" ${tool.status==='archived'?'selected':''}>${t('hub.stArchived')}</option>
    </select>
    <input class="f-desc" data-field="description" value="${esc(tool.description||'')}">
    <div class="trow-actions">
      <button class="ghost-sm" data-action="save">${t('hub.save')}</button>
      <button class="ghost-sm" data-action="delete">${t('hub.delete')}</button>
    </div>
  </div>`;
}
function renderToolsList(){
  $('toolsList').innerHTML = ADMIN_TOOLS.map(toolRowHtml).join('');
}
async function loadAdminTools(){
  $('manageError').innerHTML = '';
  const res = await AuthEngine.authedPost({ mode:'adminListTools' });
  if (!res.ok){ $('manageError').innerHTML = `<div class="errbox">${esc(res.error||'Failed to load')}</div>`; return; }
  ADMIN_TOOLS = res.tools || [];
  renderToolsList();
}
$('manageBtn').addEventListener('click', ()=>{ $('manageModal').classList.add('show'); loadAdminTools(); });
$('manageClose').addEventListener('click', ()=> $('manageModal').classList.remove('show'));
$('manageModal').addEventListener('click', e=>{ if (e.target===$('manageModal')) $('manageModal').classList.remove('show'); });

$('ntCreate').addEventListener('click', async ()=>{
  const name = $('ntName').value.trim(), path = $('ntPath').value.trim();
  if (!name || !path){ $('manageError').innerHTML = `<div class="errbox">Name and path are required.</div>`; return; }
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  $('ntCreate').disabled = true;
  const res = await AuthEngine.authedPost({
    mode:'adminCreateTool', slug, name, path,
    icon: $('ntIcon').value.trim() || '◆',
    description: $('ntDesc').value.trim(),
    service: $('ntService').value,
    status: $('ntStatus').value
  });
  $('ntCreate').disabled = false;
  if (!res.ok){ $('manageError').innerHTML = `<div class="errbox">${esc(res.error||'Failed to create')}</div>`; return; }
  $('ntName').value=''; $('ntPath').value=''; $('ntIcon').value=''; $('ntDesc').value='';
  toast(t('hub.created'));
  loadAdminTools(); loadTools();
});

$('toolsList').addEventListener('click', async e=>{
  const row = e.target.closest('.trow'); if (!row) return;
  const id = row.dataset.id;
  const action = e.target.dataset.action;
  if (action === 'save'){
    const patch = { mode:'adminUpdateTool', id };
    row.querySelectorAll('[data-field]').forEach(el => { patch[toCamel(el.dataset.field)] = el.value; });
    const res = await AuthEngine.authedPost(patch);
    if (!res.ok){ $('manageError').innerHTML = `<div class="errbox">${esc(res.error||'Failed to update')}</div>`; return; }
    toast(t('hub.updated'));
    loadTools();
  }
  if (action === 'delete'){
    const name = row.querySelector('[data-field="name"]').value;
    if (!confirm(t('hub.confirmDelete',{name}))) return;
    const res = await AuthEngine.authedPost({ mode:'adminDeleteTool', id });
    if (!res.ok){ $('manageError').innerHTML = `<div class="errbox">${esc(res.error||'Failed to delete')}</div>`; return; }
    toast(t('hub.deleted'));
    loadAdminTools(); loadTools();
  }
});
function toCamel(s){ return s.replace(/_([a-z])/g, (_,c)=>c.toUpperCase()); }

/* ==================== boot ==================== */
async function startApp(session){
  SESSION = session;
  renderProfile(session);
  if (session.isAdmin) $('manageBtn').classList.remove('hide');
  loadTools();
}

(function initAuthGate(){
  if (typeof AuthEngine === 'undefined'){
    showLoginGate();
    showLoginError('auth-engine.js did not load — check it exists at /desk/search-intelligence/auth-engine.js');
    return;
  }
  const existing = AuthEngine.getSession();
  if (existing){ hideLoginGate(); startApp(existing); }
  else { showLoginGate(); }
})();
</script>
