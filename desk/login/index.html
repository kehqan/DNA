<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Desk</title>
<!-- Skolar / Skolar Sans are licensed (TypeTogether), not on Google Fonts.
     Wire in your Adobe Fonts kit link or self-hosted @font-face here — see
     SKILL.md's Design Tokens section for both options. -->

<style>
:root{
  --flame:#FF5400;
  --teal:#1A3948; --teal2:#24506A; --honey:#FFC047; --stone:#B9CCCC; --ivory:#F8F7F6;
  --glass:rgba(255,255,255,0.16);
  --glass-filter: blur(38px) saturate(2.4) brightness(1.10);
  --lt-1:#FFFFFF; --lt-2:rgba(255,255,255,0.92); --lt-3:rgba(255,255,255,0.74);
  --border:rgba(255,255,255,0.16);
  --ts:    0 1px 2px rgba(4,12,16,0.85), 0 2px 10px rgba(4,12,16,0.55);
  --ts-lg: 0 1px 3px rgba(4,12,16,0.90), 0 3px 16px rgba(4,12,16,0.60), 0 1px 1px rgba(4,12,16,0.70);
  --rim: inset 0 0 0 1px rgba(255,255,255,0.14), inset 0 1.5px 2px rgba(255,255,255,0.34),
    inset 0 -2px 3px rgba(4,12,16,0.20), inset 0 0 32px rgba(255,255,255,0.045);
  --rim-sm: inset 0 0 0 1px rgba(255,255,255,0.11), inset 0 1px 1.5px rgba(255,255,255,0.26),
    inset 0 -1.5px 2px rgba(4,12,16,0.18);
  --ambient: 0 1px 2px rgba(6,20,28,0.44), 0 10px 30px rgba(6,20,28,0.40), 0 30px 70px rgba(6,20,28,0.34);
  --ambient-lg: 0 1px 2px rgba(6,20,28,0.46), 0 14px 36px rgba(6,20,28,0.40), 0 44px 90px rgba(6,20,28,0.38);
  --ambient-hi: 0 1px 2px rgba(6,20,28,0.50), 0 20px 46px rgba(6,20,28,0.44), 0 56px 110px rgba(6,20,28,0.42);
  --chip:rgba(255,255,255,0.10); --chip-hover:rgba(255,255,255,0.18);
  --eo:cubic-bezier(0.25,0.46,0.45,0.94); --serif:'Skolar',Georgia,serif; --sans:'Skolar Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{font-family:var(--sans);color:var(--lt-2);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:linear-gradient(160deg,#0F1622 0%,#0B1016 45%,#0C0E14 75%,#120E18 100%);overflow-x:hidden}

/* Same scene treatment as the rest of Desk — photo + dark overlay, no orbs
   (this product never used the orb layer, so this stays consistent with it). */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(160deg,#0F1622 0%,#0B1016 45%,#0C0E14 75%,#120E18 100%)}
.scene::before{content:'';position:absolute;inset:0;
  background-image:url('https://images.pexels.com/photos/10464443/pexels-photo-10464443.jpeg');
  background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:0.55;filter:saturate(1.05) contrast(1.02)}
.scene::after{content:'';position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(15,22,34,0.72) 0%,rgba(11,16,22,0.78) 45%,rgba(12,14,20,0.82) 75%,rgba(18,14,24,0.86) 100%)}

.top-wordmark{position:relative;z-index:1;padding:28px 24px 0}
.top-wordmark a{font-family:var(--serif);font-size:17px;color:var(--lt-1);text-shadow:var(--ts);text-decoration:none}
.top-wordmark em{font-style:normal;color:#FFB07A;font-weight:600}

/* ===== split hero composition ===== */
.login-split{
  position:relative;z-index:1;
  display:grid;grid-template-columns:1fr 0.9fr;gap:56px;align-items:center;
  min-height:calc(100vh - 90px);max-width:1180px;margin:0 auto;padding:20px 24px 60px;
}
.login-copy{text-align:left}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--lt-3);
  text-shadow:var(--ts);margin-bottom:18px;display:flex;align-items:center;gap:7px;animation:rise 460ms var(--eo) both}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--flame);
  box-shadow:0 0 10px rgba(255,84,0,0.90);animation:pring 2.5s ease-in-out infinite}
@keyframes pring{0%,100%{box-shadow:0 0 10px rgba(255,84,0,0.90),0 0 0 0 rgba(255,84,0,0.50)}
  50%{box-shadow:0 0 10px rgba(255,84,0,0.90),0 0 0 6px rgba(255,84,0,0)}}
.login-copy h1{font-family:var(--serif);font-size:48px;font-weight:400;letter-spacing:-0.02em;line-height:1.1;
  color:var(--lt-1);text-shadow:var(--ts-lg);margin-bottom:16px;max-width:480px;animation:rise 460ms var(--eo) 40ms both}
.login-copy h1 em{font-style:normal;color:#FFB07A}
.login-copy p{font-family:var(--serif);font-size:16px;color:var(--lt-3);text-shadow:var(--ts);
  line-height:1.5;max-width:400px;margin-bottom:28px;animation:rise 460ms var(--eo) 80ms both}
.login-cta-row{display:flex;align-items:center;gap:12px;animation:rise 460ms var(--eo) 120ms both}
.ghost-lg{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--lt-1);text-shadow:var(--ts);
  padding:12px 22px;border-radius:100px;border:none;cursor:pointer;text-decoration:none;
  background:var(--chip);box-shadow:var(--rim-sm);
  transition:background 120ms ease-out,transform 120ms var(--eo);display:inline-flex;align-items:center;gap:8px}
.ghost-lg:hover{background:var(--chip-hover);transform:translateY(-1.5px)}
.ghost-lg svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.login-side{display:flex;justify-content:center;animation:rise 560ms var(--eo) 100ms both}
.login-card{position:relative;width:100%;max-width:380px;border-radius:26px;padding:36px 32px;
  background:var(--glass);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  box-shadow:var(--ambient-hi),var(--rim);text-align:center}
.login-card::before{content:'';position:absolute;inset:0;border-radius:26px;pointer-events:none;
  background:radial-gradient(130% 90% at 22% -12%,rgba(255,255,255,0.26) 0%,rgba(255,255,255,0.07) 26%,transparent 52%);
  mix-blend-mode:screen}
.login-card>*{position:relative;z-index:1}
.login-wordmark{font-family:var(--serif);font-size:20px;color:var(--lt-1);text-shadow:var(--ts-lg);margin-bottom:28px}
.login-wordmark em{font-style:normal;color:#FFB07A;font-weight:600}
.login-title{font-family:var(--serif);font-size:23px;color:var(--lt-1);text-shadow:var(--ts-lg);margin-bottom:6px}
.login-sub{font-size:12px;color:var(--lt-3);text-shadow:var(--ts);margin-bottom:24px}
.login-error{font-size:11.5px;color:#FF8A5C;background:rgba(255,84,0,0.10);border:1px solid rgba(255,84,0,0.22);
  border-radius:12px;padding:9px 12px;margin-bottom:12px;display:none;text-align:left}
.login-error.show{display:block}
.login-field{margin-bottom:14px;text-align:left}
.login-field label{display:block;font-size:11px;color:var(--lt-3);text-shadow:var(--ts);margin-bottom:6px;padding-left:4px}
.login-field input{width:100%;font-family:var(--sans);font-size:13.5px;color:var(--lt-1);
  padding:11px 15px;border-radius:14px;border:none;outline:none;
  background:var(--chip);box-shadow:var(--rim-sm);transition:background 130ms ease-out,box-shadow 130ms ease-out}
.login-field input::placeholder{color:rgba(255,255,255,0.4)}
.login-field input:focus{background:var(--chip-hover);box-shadow:var(--rim-sm),inset 0 0 0 1.5px rgba(255,150,80,0.45)}
.btn-flame{width:100%;margin-top:10px;font-family:var(--sans);font-size:14.5px;font-weight:700;color:#fff;
  padding:13px 21px;border-radius:100px;border:none;cursor:pointer;
  background:linear-gradient(180deg,#FF7A38 0%,var(--flame) 60%,#E24E00 100%);
  box-shadow:0 1px 2px rgba(120,36,0,0.35),0 8px 20px rgba(255,84,0,0.26),
    inset 0 1px 0 rgba(255,255,255,0.30),inset 0 -1px 1px rgba(120,34,0,0.30);
  transition:transform 120ms var(--eo),box-shadow 120ms ease-out;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn-flame:hover{transform:translateY(-1.5px);
  box-shadow:0 1px 2px rgba(120,36,0,0.38),0 10px 24px rgba(255,84,0,0.30),
    inset 0 1px 0 rgba(255,255,255,0.34),inset 0 -1px 1px rgba(120,34,0,0.32)}
.btn-flame:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}

@media(max-width:860px){
  .login-split{grid-template-columns:1fr;min-height:auto;padding-top:40px}
  .login-copy h1{font-size:34px}
  .login-side{justify-content:flex-start}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
</style>
</head>
<body>

<div class="scene"></div>

<div class="top-wordmark"><a href="https://pilotdesk.space/">Desk<em>.</em></a></div>

<div class="login-split">
  <div class="login-copy">
    <div class="eyebrow"><span class="pdot"></span> One account, every Desk tool</div>
    <h1 id="loginHeadline">Sign in once. <em>Work everywhere.</em></h1>
    <p id="loginSubheadline">Your Desk account covers Search Intelligence, the Library, and every tool on the shelf.</p>
    <div class="login-cta-row">
      <a class="ghost-lg" href="https://pilotdesk.space/">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to pilotdesk.space
      </a>
    </div>
  </div>
  <div class="login-side">
    <div class="login-card">
      <div class="login-wordmark">Desk<em>.</em></div>
      <div class="login-title">Sign in</div>
      <div class="login-sub">Newsroom AI tools</div>
      <div class="login-error" id="loginError"></div>
      <div class="login-field">
        <label>Username</label>
        <input id="loginUsername" autocomplete="username" placeholder="e.g. user1">
      </div>
      <div class="login-field">
        <label>Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn-flame" id="loginSubmit">Sign in →</button>
    </div>
  </div>
</div>

<script src="/desk/search-intelligence/auth-engine.js"></script>
<script>
const $ = id => document.getElementById(id);

/* Only ever redirect to a same-site relative path — never trust ?next=
   as a full URL, or this becomes an open redirect. */
function safeNextPath(){
  const next = new URLSearchParams(window.location.search).get('next');
  if (next && next.startsWith('/') && !next.startsWith('//')) return next;
  return null;
}

/* Left-side headline is smart: if the person arrived here because they
   tried to open a specific tool directly (?next=...), the headline speaks
   to that tool instead of the generic pitch. The CTA underneath always
   stays the same (back to pilotdesk.space) regardless of which headline
   is showing. Known first-party tool paths only — an unrecognized next
   just falls back to the generic headline. */
const TOOL_HEADLINES = {
  '/desk/search-intelligence/': {
    h1: 'Sign in to <em>Search Intelligence.</em>',
    p: 'Live queries, Discover winners, and AI-suggested headlines.'
  },
  '/desk/search-intelligence/content-gap/': {
    h1: 'Sign in to <em>Content Gap.</em>',
    p: 'What readers are searching for that nobody has covered yet.'
  },
  '/desk/search-intelligence/library/': {
    h1: 'Sign in to your <em>Library.</em>',
    p: 'Every headline you\u2019ve chosen to run with, saved and searchable.'
  },
  '/desk/search-intelligence/survey/': {
    h1: 'Sign in to the <em>Survey.</em>',
    p: 'Tell us how the tool is working for your service.'
  },
  '/desk/search-intelligence/admin/': {
    h1: 'Sign in to <em>Prompt Admin.</em>',
    p: 'Edit the headline prompt and manage users for your service.'
  }
};
const DEFAULT_LOGIN_HEADLINE = {
  h1: 'Sign in once. <em>Work everywhere.</em>',
  p: 'Your Desk account covers Search Intelligence, the Library, and every tool on the shelf.'
};
function applyLoginHeadline(){
  const next = safeNextPath();
  let match = null;
  if (next){
    match = TOOL_HEADLINES[next] || null;
    if (!match){
      const hit = Object.keys(TOOL_HEADLINES).find(path => next.startsWith(path));
      if (hit) match = TOOL_HEADLINES[hit];
    }
  }
  const d = match || DEFAULT_LOGIN_HEADLINE;
  $('loginHeadline').innerHTML = d.h1;
  $('loginSubheadline').textContent = d.p;
}

function showLoginError(msg){ const el = $('loginError'); el.textContent = msg; el.classList.add('show'); }
function clearLoginError(){ $('loginError').classList.remove('show'); }

async function doLogin(){
  const u = $('loginUsername').value.trim(), p = $('loginPassword').value;
  clearLoginError();
  if (!u || !p) return showLoginError('Enter a username and password');
  $('loginSubmit').disabled = true; $('loginSubmit').textContent = 'Signing in…';
  try{
    const res = await AuthEngine.login(u, p);
    if (!res.ok) return showLoginError(res.error || 'Invalid username or password');
    $('loginPassword').value = '';
    window.location.href = safeNextPath() || '/desk/';
  }catch(e){ showLoginError(String((e&&e.message)||e)); }
  finally{ $('loginSubmit').disabled = false; $('loginSubmit').textContent = 'Sign in →'; }
}
$('loginSubmit').addEventListener('click', doLogin);
$('loginUsername').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
$('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

(function init(){
  applyLoginHeadline();
  if (typeof AuthEngine === 'undefined'){
    showLoginError('auth-engine.js did not load — check it exists at /desk/search-intelligence/auth-engine.js');
    return;
  }
  // Already signed in (e.g. opened this link in a second tab) — skip
  // straight through instead of making them log in again.
  const existing = AuthEngine.getSession();
  if (existing) window.location.href = safeNextPath() || '/desk/';
})();
</script>

</body>
</html>
