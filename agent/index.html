<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Briefs Library | DNA</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Noto+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ivory:   #F8F7F6;
  --teal:    #1A3948;
  --teal2:   #24506A;
  --flame:   #FF5400;
  --honey:   #FFC047;
  --border:  rgba(26,57,72,0.09);
  --muted:   rgba(26,57,72,0.52);
  --soft:    rgba(26,57,72,0.36);
  --glass:   rgba(255,255,255,0.72);
  --glass-b: rgba(255,255,255,0.85);
  --gs: 0 8px 32px rgba(26,57,72,0.10), 0 1.5px 4px rgba(26,57,72,0.06);
  --gi: inset 0 1px 0 rgba(255,255,255,0.92), inset 0 -1px 0 rgba(26,57,72,0.03);
  --eo: cubic-bezier(0.25,0.46,0.45,0.94);
  --serif: 'Lora', Georgia, serif;
  --sans:  'Noto Sans', system-ui, sans-serif;
  --inkC: 26,57,72;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: var(--sans); color: var(--teal); -webkit-font-smoothing: antialiased; background: var(--ivory); }
body::before { content: ''; position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse 900px 600px at 15% -5%, rgba(255,84,0,0.06), transparent 60%),
    radial-gradient(ellipse 900px 700px at 90% 10%, rgba(26,57,72,0.05), transparent 60%); }
a { color: var(--teal2); }

/* ---- Header ---- */
.hdr { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px; background: var(--glass); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  border-bottom: 1px solid var(--border); }
.hdr-brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.hdr-icon { font-size: 22px; }
.hdr-title { font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--teal); }
.hdr-sub { font-size: 11px; color: var(--soft); margin-top: 1px; }
.hdr-actions { display: flex; align-items: center; gap: 10px; }
.btn { font-family: var(--sans); font-size: 12.5px; font-weight: 600; color: var(--teal); background: rgba(var(--inkC),0.06);
  border: 1px solid var(--border); border-radius: 100px; padding: 9px 17px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: rgba(var(--inkC),0.1); }
.btn.primary { background: var(--flame); color: #fff; border-color: transparent; }
.btn.primary:hover { background: #e64a00; }
.btn.ghost { background: transparent; border-color: var(--border); }

/* ---- Layout ---- */
.main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 100px; }
.view { display: none; }
.view.show { display: block; }

/* ---- Library grid ---- */
.lib-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
.lib-title { font-family: var(--serif); font-size: 24px; font-weight: 600; }
.lib-search { font-family: var(--sans); font-size: 13px; color: var(--teal); background: rgba(var(--inkC),0.04);
  border: 1px solid var(--border); border-radius: 100px; padding: 9px 16px; outline: none; width: 260px; }
.lib-search:focus { border-color: var(--flame); }
.brief-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.brief-card { background: var(--glass); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  border: 1px solid var(--glass-b); box-shadow: var(--gs), var(--gi); border-radius: 16px; padding: 18px; cursor: pointer;
  transition: transform 160ms var(--eo); }
.brief-card:hover { transform: translateY(-2px); }
.brief-card-topic { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--teal); margin-bottom: 6px; }
.brief-card-meta { font-size: 11px; color: var(--soft); display: flex; gap: 10px; flex-wrap: wrap; }
.brief-card-priorities { margin-top: 10px; font-size: 12px; color: var(--muted); }
.brief-card-priorities b { color: var(--flame); }
.lib-empty { text-align: center; padding: 60px 20px; color: var(--soft); }
.lib-empty-icon { font-size: 40px; margin-bottom: 10px; }

/* ---- Paste view ---- */
.paste-panel { background: var(--glass); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  border: 1px solid var(--glass-b); box-shadow: var(--gs), var(--gi); border-radius: 18px; padding: 24px; }
.field { margin-bottom: 16px; }
.field label { font-size: 12px; font-weight: 700; color: var(--teal); margin-bottom: 6px; display: block; }
.field input, .field select { width: 100%; font-family: var(--sans); font-size: 13.5px; color: var(--teal); background: rgba(var(--inkC),0.04);
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--flame); }
.paste-textarea { width: 100%; min-height: 320px; font-family: 'SF Mono', Menlo, monospace; font-size: 12px; line-height: 1.6;
  color: var(--teal); background: rgba(var(--inkC),0.03); border: 1px solid var(--border); border-radius: 12px; padding: 16px; outline: none; resize: vertical; }
.paste-hint { font-size: 11.5px; color: var(--soft); margin-top: 6px; }

/* ---- Review view ---- */
.review-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .review-layout { grid-template-columns: 1fr; } }
.stat-strip { display: flex; gap: 18px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-pill { background: var(--glass); border: 1px solid var(--glass-b); border-radius: 100px; padding: 8px 16px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat-pill b { font-family: var(--serif); font-size: 15px; color: var(--flame); }

/* ---- Tree-style hierarchical sections ---- */
.tree-node { position: relative; margin-bottom: 4px; }
.tree-node[data-lvl="1"] { margin-top: 22px; }
.tree-node[data-lvl="1"]:first-child { margin-top: 0; }
.tree-children { margin-left: 20px; border-left: 2px solid var(--border); padding-left: 16px; margin-top: 6px; }
.node-head { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 10px 14px; border-radius: 12px;
  background: var(--glass); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  border: 1px solid var(--glass-b); box-shadow: var(--gs), var(--gi); transition: background 140ms; }
.tree-node[data-lvl="1"] > .node-head { box-shadow: var(--gs), var(--gi); }
.tree-node[data-lvl="2"] > .node-head, .tree-node[data-lvl="3"] > .node-head, .tree-node[data-lvl="4"] > .node-head { box-shadow: none; border-color: var(--border); background: rgba(var(--inkC),0.02); }
.node-head:hover { background: rgba(var(--inkC),0.05); }
.chevron { font-size: 10px; color: var(--soft); transition: transform 200ms var(--eo); flex-shrink: 0; }
.chevron.open { transform: rotate(90deg); }
.node-title { font-weight: 700; color: var(--teal); flex: 1; }
.tree-node[data-lvl="1"] .node-title { font-family: var(--serif); font-size: 16px; }
.tree-node[data-lvl="2"] .node-title { font-size: 13.5px; }
.tree-node[data-lvl="3"] .node-title, .tree-node[data-lvl="4"] .node-title { font-size: 12.5px; color: var(--teal2); }
.node-body { max-height: 3000px; overflow: hidden; transition: max-height 260ms var(--eo), opacity 200ms; padding: 10px 14px 4px; font-size: 13px; line-height: 1.7; color: var(--muted); }
.node-body.collapsed { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; }
.node-body ul { margin: 6px 0; padding-left: 18px; }
.node-body li { margin-bottom: 5px; position: relative; padding-right: 28px; }
.node-body li:hover .promote-trigger { opacity: 1; }
.promote-trigger { position: absolute; right: 0; top: -1px; opacity: 0; transition: opacity 140ms; font-size: 10.5px; background: rgba(var(--inkC),0.07);
  border: none; border-radius: 6px; padding: 2px 7px; cursor: pointer; color: var(--soft); }
.promote-trigger:hover { background: var(--flame); color: #fff; }
.citation-link { color: var(--teal2); text-decoration: none; border-bottom: 1px dotted rgba(36,80,106,0.4); font-size: 11.5px; }
.citation-link:hover { border-bottom-style: solid; }

/* ---- Promote category menu (popover) ---- */
.promote-menu { position: absolute; z-index: 50; background: #fff; border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(26,57,72,0.2); padding: 6px; display: none; min-width: 150px; }
.promote-menu.show { display: block; }
.promote-menu-item { font-size: 12px; padding: 7px 10px; border-radius: 7px; cursor: pointer; display: flex; align-items: center; gap: 7px; color: var(--teal); }
.promote-menu-item:hover { background: rgba(255,84,0,0.08); }

/* ---- Multi-category promotion boxes (editor layer) ---- */
.editor-panel { position: sticky; top: 90px; max-height: calc(100vh - 110px); overflow-y: auto; }
.promo-box { background: rgba(255,84,0,0.05); border: 1.5px solid rgba(255,84,0,0.28); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; animation: boxIn 260ms var(--eo); }
@keyframes boxIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.promo-box-title { font-size: 11.5px; font-weight: 800; color: var(--flame); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.promo-box-count { background: var(--flame); color: #fff; border-radius: 100px; font-size: 10px; padding: 1px 7px; }
.promo-item { background: #fff; border: 1px solid rgba(255,84,0,0.18); border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; font-size: 12.5px; animation: itemIn 200ms var(--eo); }
@keyframes itemIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
.promo-item-text { color: var(--teal); font-weight: 600; }
.promo-item-text a { color: var(--teal2); }
.promo-item-note { font-size: 11px; color: var(--muted); margin-top: 4px; }
.promo-item-actions { display: flex; gap: 4px; margin-top: 6px; }
.mini-icon-btn { font-size: 10px; background: rgba(var(--inkC),0.06); border: none; border-radius: 6px; padding: 3px 7px; cursor: pointer; color: var(--soft); }
.mini-icon-btn:hover { background: rgba(var(--inkC),0.12); }
.add-custom-cat { font-size: 11px; color: var(--teal2); background: none; border: 1px dashed var(--border); border-radius: 8px; padding: 7px; width: 100%; cursor: pointer; margin-top: 4px; }
.link-item { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-bottom: 6px; font-size: 12px; }
.link-item a { font-weight: 600; }
.link-item-tag { font-size: 9px; text-transform: uppercase; color: var(--soft); }
.add-link-form { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.add-link-form input, .add-link-form select { font-size: 11.5px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: rgba(var(--inkC),0.03); }
.small-btn { font-size: 11px; font-weight: 700; color: #fff; background: var(--flame); border: none; border-radius: 100px; padding: 7px 14px; cursor: pointer; }
.resources-box { background: var(--glass); border: 1px solid var(--glass-b); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.resources-box .promo-box-title { color: var(--teal2); }

/* ---- Parsing "live" feedback ---- */
.parse-progress { font-size: 12px; color: var(--soft); margin-top: 10px; min-height: 18px; }
.parse-progress.active::after { content: '●'; animation: blink 1s infinite; margin-left: 4px; color: var(--flame); }
@keyframes blink { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }

/* ---- Detail/showcase view ---- */
.showcase-hero { margin-bottom: 24px; }
.showcase-topic { font-family: var(--serif); font-size: 30px; font-weight: 600; color: var(--teal); line-height: 1.25; }
.showcase-meta { font-size: 12px; color: var(--soft); margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
.priority-verdict { background: linear-gradient(135deg, rgba(255,84,0,0.08), rgba(255,192,71,0.06)); border: 1.5px solid rgba(255,84,0,0.3);
  border-radius: 18px; padding: 18px 20px; margin-bottom: 14px; }
.priority-verdict-title { font-size: 11.5px; font-weight: 800; color: var(--flame); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.priority-verdict-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,84,0,0.15); }
.priority-verdict-item:last-child { border-bottom: none; }
.priority-verdict-rank { font-family: var(--serif); font-size: 17px; font-weight: 700; color: var(--flame); flex-shrink: 0; width: 24px; }
.priority-verdict-text { font-weight: 600; color: var(--teal); font-size: 13.5px; }
.priority-verdict-text a { color: var(--teal2); }
.priority-verdict-note { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.verdict-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin: 20px 0; }
.showcase-toc { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; position: sticky; top: 74px; z-index: 20;
  background: var(--ivory); padding: 10px 0; }
.toc-chip { font-size: 11.5px; font-weight: 600; color: var(--teal2); background: rgba(var(--inkC),0.06); padding: 6px 13px; border-radius: 100px; cursor: pointer; text-decoration: none; transition: background 160ms, color 160ms; }
.toc-chip.active { background: var(--flame); color: #fff; }
.mtable { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; }
.mtable th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--soft); padding: 6px 8px; border-bottom: 1px solid var(--border); }
.mtable td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.entity-chip { display: inline-block; font-size: 11.5px; background: rgba(36,80,106,0.08); color: var(--teal2); padding: 3px 10px; border-radius: 100px; margin: 2px 4px 2px 0; }
.timeline-item { display: flex; gap: 10px; padding: 6px 0; border-left: 2px solid var(--border); padding-left: 14px; margin-left: 4px; position: relative; }
.timeline-item::before { content: ''; position: absolute; left: -5px; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--flame); }
.resources-panel { background: var(--glass); border: 1px solid var(--glass-b); box-shadow: var(--gs), var(--gi); border-radius: 14px; padding: 16px 18px; margin: 20px 0; }

.dash-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px); z-index: 99;
  background: var(--teal); color: #fff; font-size: 12.5px; font-weight: 500; padding: 9px 20px; border-radius: 100px;
  box-shadow: 0 4px 18px rgba(26,57,72,0.3); opacity: 0; pointer-events: none; transition: opacity 220ms, transform 220ms; white-space: nowrap; }
.dash-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.copilot-fab { position: fixed; bottom: 28px; right: 24px; z-index: 60; width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--flame), var(--honey)); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 25px; color: #fff;
  box-shadow: 0 6px 20px rgba(255,84,0,0.35), 0 2px 8px rgba(0,0,0,0.15); }
.copilot-fab:hover { transform: scale(1.08); }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-brand" id="brandHome">
    <span class="hdr-icon">🧬</span>
    <div>
      <div class="hdr-title">Agent Briefs Library</div>
      <div class="hdr-sub">DNA — turn any LLM /agentmode answer into a shareable newsroom brief</div>
    </div>
  </div>
  <div class="hdr-actions">
    <button class="btn" id="navLibrary">📚 Library</button>
    <button class="btn primary" id="navPaste">＋ New Brief</button>
  </div>
</div>

<div class="main">

  <!-- LIBRARY VIEW -->
  <div class="view" id="viewLibrary">
    <div class="lib-head">
      <div class="lib-title">Knowledge Library</div>
      <input type="text" class="lib-search" id="librarySearch" placeholder="Search topics…">
    </div>
    <div class="brief-grid" id="briefGrid"><div class="lib-empty">Loading…</div></div>
  </div>

  <!-- PASTE VIEW -->
  <div class="view" id="viewPaste">
    <div class="paste-panel">
      <div class="field">
        <label>Topic / headline for this brief</label>
        <input type="text" id="pasteTopic" placeholder="e.g. Strait of Hormuz escalation — July 7-8">
      </div>
      <div class="field">
        <label>Editor name (optional)</label>
        <input type="text" id="pasteEditor" placeholder="Your name">
      </div>
      <div class="field">
        <label>Source LLM</label>
        <select id="pasteSourceLlm">
          <option>ChatGPT</option>
          <option>Copilot</option>
          <option>Claude</option>
          <option>Gemini</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Paste the /agentmode answer</label>
        <textarea class="paste-textarea" id="pasteText" placeholder="Paste the full LLM response here — any format is fine, this will auto-detect headings, tables, lists, and links."></textarea>
        <div class="paste-hint">Works with output from any LLM — ChatGPT, Copilot, Claude, Gemini. Headings, markdown tables, bullet lists, and URLs are detected automatically.</div>
      </div>
      <button class="btn primary" id="parseBtn">Parse &amp; Review →</button>
      <div class="parse-progress" id="parseProgress"></div>
    </div>
  </div>

  <!-- REVIEW VIEW -->
  <div class="view" id="viewReview">
    <div class="lib-head">
      <div class="lib-title" id="reviewTitle">Review brief</div>
      <button class="btn primary" id="saveBriefBtn">💾 Save to Library</button>
    </div>
    <div class="stat-strip" id="statStrip"></div>
    <div class="review-layout">
      <div id="reviewSections"></div>
      <div class="editor-panel">
        <div id="promoBoxesContainer"></div>
        <div class="resources-box">
          <div class="promo-box-title">🔗 Additional Resources</div>
          <div id="linksList"></div>
          <div class="add-link-form">
            <input type="text" id="newLinkLabel" placeholder="Label">
            <input type="text" id="newLinkUrl" placeholder="https://…">
            <select id="newLinkTag"><option value="internal">Internal</option><option value="external">External</option></select>
            <input type="text" id="newLinkNote" placeholder="Note (optional)">
            <button class="small-btn" id="addLinkBtn">+ Add resource</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- DETAIL / SHOWCASE VIEW -->
  <div class="view" id="viewDetail"></div>

</div>

<button class="copilot-fab" id="copilotFab" title="Open Copilot">🤖</button>
<div class="dash-toast" id="dashToast"></div>

<script>
/* ==================== Agent Briefs Library ==================== */
const SUPABASE_URL = 'https://yiewnykbchfadipznpet.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpZXdueWtiY2hmYWRpcHpucGV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNzM3NTUsImV4cCI6MjA5NDc0OTc1NX0.utnlpToZGH7hno0QTXlrtWvzKDgP28Gv3Je7BBIRwmM';

const CATEGORY_META = {
  angle:   { label: 'Priority Angles', icon: '★' },
  source:  { label: 'Key Sources', icon: '🔗' },
  person:  { label: 'People to Watch', icon: '👤' },
  keyword: { label: 'Keywords', icon: '🏷️' },
};
const CATEGORY_ORDER = ['angle', 'source', 'person', 'keyword'];

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function linkify(text) {
  if (text == null) return '';
  const mdLinkRe = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
  const placeholders = [];
  let work = String(text).replace(mdLinkRe, (m, label, url) => {
    placeholders.push({ label, url });
    return `\u0000${placeholders.length - 1}\u0000`;
  });
  work = escapeHtml(work);
  const bareUrlRe = /(https?:\/\/[^\s<>"')]+)/g;
  work = work.replace(bareUrlRe, url => `<a href="${url}" target="_blank" rel="noopener noreferrer" class="citation-link">${url}</a>`);
  work = work.replace(/\u0000(\d+)\u0000/g, (m, i) => {
    const p = placeholders[+i];
    return `<a href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer" class="citation-link">${escapeHtml(p.label)}</a>`;
  });
  return work;
}
function extractLinks(text) {
  const out = [];
  const mdLinkRe = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
  let m;
  while ((m = mdLinkRe.exec(text))) out.push({ label: m[1], url: m[2] });
  return out;
}
function dashToast(msg) {
  const el = document.getElementById('dashToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(dashToast._t);
  dashToast._t = setTimeout(() => el.classList.remove('show'), 2400);
}

async function sbSelect(table, query) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
  });
  if (!res.ok) throw new Error(`select failed (${res.status})`);
  return res.json();
}
async function sbInsert(table, row) {

async function sbUpdate(table, id, patch) {

/* ==================== HIERARCHICAL PARSER ==================== */
function matchHeading(line) {
  const t = line.trim();
  if (!t) return null;
  const atx = t.match(/^(#{1,4})\s+(.+)$/);
  if (atx) return { level: atx[1].length, text: atx[2].replace(/\*+/g, '').trim() };
  if (/^\*\*[^*]{2,80}\*\*:?$/.test(t)) return { level: null, text: t.replace(/^\*\*|\*\*:?$/g, '').trim() };
  if (/^[A-Z][A-Z0-9 &/'\-:]{3,70}$/.test(t) && !/^https?:\/\//.test(t)) return { level: null, text: t.replace(/:$/, '').trim() };
  if (/^[A-Z][A-Za-z0-9 &/'\-]{3,60}:$/.test(t) && t.length < 60) return { level: null, text: t.replace(/:$/, '').trim() };
  return null;
}
function classifyHeading(h) {
  const l = h.toLowerCase();
  if (/timeline/.test(l)) return 'timeline';
  if (/entit|stakeholder|people|who/.test(l)) return 'entities';
  if (/matrix|coverage|table/.test(l)) return 'table';
  if (/recommend|action/.test(l)) return 'actions';
  if (/summary|assessment|snapshot/.test(l)) return 'summary';
  if (/source|landscape/.test(l)) return 'sources';
  return 'text';
}
function parseMarkdownTable(lines) {
  const rows = lines.map(l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
  if (rows.length < 2) return null;
  const isSep = rows[1].every(c => /^:?-{2,}:?$/.test(c));
  const headers = rows[0];
  const body = isSep ? rows.slice(2) : rows.slice(1);
  return { headers, rows: body };
}
function makeNode(heading, level) {
  return { heading, level, type: heading ? classifyHeading(heading) : 'root', children: [], raw: [], items: [], table: null, paragraph: '' };
}
function processNode(node) {
  const raw = node.raw;
  const tableLineIdx = raw.map((l, i) => (l.includes('|') && l.trim().length > 2 ? i : -1)).filter(i => i >= 0);
  if (tableLineIdx.length >= 2) {
    let bestStart = -1, bestLen = 0, curStart = -1, curLen = 0, prevIdx = -2;
    for (const idx of tableLineIdx) {
      if (idx === prevIdx + 1) { curLen++; } else { curStart = idx; curLen = 1; }
      if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; }
      prevIdx = idx;
    }
    if (bestLen >= 2) {
      const tbl = parseMarkdownTable(raw.slice(bestStart, bestStart + bestLen));
      if (tbl) {
        node.table = tbl;
        node.raw = [...raw.slice(0, bestStart), ...raw.slice(bestStart + bestLen)];
      }
    }
  }
  const remaining = [];
  for (const l of node.raw) {
    const t = l.trim();
    if (/^(\*{3,}|-{3,}|_{3,})$/.test(t)) continue;
    const m = t.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (m && m[1].trim()) node.items.push(m[1].trim());
    else if (t) remaining.push(t);
  }
  node.paragraph = remaining.join(' ').trim();
  delete node.raw;
  for (const child of node.children) processNode(child);
}
function parseAgentText(raw) {
  const lines = raw.replace(/\r\n/g, '\n').split('\n');
  const root = makeNode(null, 0);
  const stack = [root];
  for (const line of lines) {
    const h = matchHeading(line);
    if (h) {
      const parent = stack[stack.length - 1];
      const level = h.level != null ? h.level : parent.level + 1;
      while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
      const node = makeNode(h.text, level);
      stack[stack.length - 1].children.push(node);
      stack.push(node);
    } else {
      stack[stack.length - 1].raw.push(line);
    }
  }
  processNode(root);
  return root.children;
}

function collectStats(nodes) {
  let sections = 0, sources = 0, items = 0;
  function walk(list) {
    for (const n of list) {
      sections++;
      items += n.items.length;
      for (const it of n.items) sources += extractLinks(it).length;
      sources += extractLinks(n.paragraph).length;
      walk(n.children);
    }
  }
  walk(nodes);
  return { sections, sources, items };
}

function nodeBodyInnerHtml(node) {
  let body = '';
  if (node.paragraph) body += `<p>${linkify(node.paragraph)}</p>`;
  if (node.items.length) {
    body += '<ul>' + node.items.map(it =>
      `<li>${linkify(it)}<button class="promote-trigger" data-text="${escapeHtml(it)}">★ promote</button></li>`
    ).join('') + '</ul>';
  }
  if (node.table) {
    body += `<table class="mtable"><thead><tr>${node.table.headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>` +
      node.table.rows.map(r => `<tr>${r.map(c => `<td>${linkify(c)}</td>`).join('')}</tr>`).join('') + `</tbody></table>`;
  }
  return body;
}
function nodeHtml(node) {
  const hasOwnContent = !!(node.paragraph || node.items.length || node.table);
  const childrenHtml = node.children.length ? `<div class="tree-children">${node.children.map(c => nodeHtml(c)).join('')}</div>` : '';
  const bodyInner = nodeBodyInnerHtml(node);
  return `
    <div class="tree-node" data-lvl="${node.level}">
      <div class="node-head" data-toggle="1">
        <span class="chevron open">▸</span>
        <span class="node-title">${escapeHtml(node.heading)}</span>
      </div>
      ${hasOwnContent ? `<div class="node-body">${bodyInner}</div>` : ''}
      ${childrenHtml}
    </div>`;
}

function wireTreeListeners(wrap) {
  wrap.querySelectorAll('[data-toggle]').forEach(headEl => {
    const node = headEl.parentElement;
    const chevron = headEl.querySelector('.chevron');
    const body = node.querySelector(':scope > .node-body');
    headEl.addEventListener('click', () => {
      chevron.classList.toggle('open');
      if (body) body.classList.toggle('collapsed');
      const children = node.querySelector(':scope > .tree-children');
      if (children) children.style.display = children.style.display === 'none' ? '' : 'none';
    });
  });
  wrap.querySelectorAll('.promote-trigger').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openPromoteMenu(btn, btn.getAttribute('data-text'));
    });
  });
}

let activePromoteMenu = null;
function openPromoteMenu(anchorEl, text) {
  closePromoteMenu();
  const menu = document.createElement('div');
  menu.className = 'promote-menu show';
  menu.innerHTML = CATEGORY_ORDER.map(cat =>

  document.body.appendChild(menu);
  const r = anchorEl.getBoundingClientRect();
  menu.style.position = 'absolute';
  menu.style.left = Math.min(r.left + window.scrollX, window.innerWidth - 170) + 'px';
  menu.style.top = (r.bottom + window.scrollY + 4) + 'px';

  menu.querySelectorAll('[data-cat]').forEach(item => {
    item.addEventListener('click', () => {
      let cat = item.getAttribute('data-cat');
      if (cat === '__custom') {

        cat = c.trim().toLowerCase();

}
function closePromoteMenuOnce() { closePromoteMenu(); }
function closePromoteMenu() {
  if (activePromoteMenu) { activePromoteMenu.remove(); activePromoteMenu = null; }
  document.removeEventListener('click', closePromoteMenuOnce);
}

function promoteItem(text, category) {
  const links = extractLinks(text);
  const url = links.length ? links[0].url : null;
  currentPromoted.push({ id: 'p' + (promoIdSeq++), text, url, category, note: '' });
  renderPromoBoxes();
  renderStatStrip();
  dashToast(`Added to ${CATEGORY_META[category] ? CATEGORY_META[category].label : category}`);
}

function renderPromoBoxes() {
  const container = document.getElementById('promoBoxesContainer');
  const cats = Array.from(new Set([...CATEGORY_ORDER, ...currentPromoted.map(p => p.category)]));
  container.innerHTML = cats.map(cat => {
    const items = currentPromoted.filter(p => p.category === cat);
    if (!items.length) return '';
    const meta = CATEGORY_META[cat] || { label: cat.charAt(0).toUpperCase() + cat.slice(1), icon: '📌' };
    return `
      <div class="promo-box" data-cat="${cat}">
        <div class="promo-box-title">${meta.icon} ${meta.label} <span class="promo-box-count">${items.length}</span></div>
        ${items.map(p => `
          <div class="promo-item" data-id="${p.id}">
            <div class="promo-item-text">${p.url ? `<a href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(p.text)}</a>` : escapeHtml(p.text)}</div>
            ${p.note ? `<div class="promo-item-note">${escapeHtml(p.note)}</div>` : ''}
            <div class="promo-item-actions">
              <button class="mini-icon-btn" data-act="up" data-id="${p.id}">↑</button>
              <button class="mini-icon-btn" data-act="down" data-id="${p.id}">↓</button>
              <button class="mini-icon-btn" data-act="note" data-id="${p.id}">✎ note</button>
              <button class="mini-icon-btn" data-act="remove" data-id="${p.id}">✕</button>
            </div>
          </div>`).join('')}
      </div>`;
  }).join('');
  container.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-id');
      const act = el.getAttribute('data-act');
      const idx = currentPromoted.findIndex(p => p.id === id);
      if (idx < 0) return;
      if (act === 'remove') currentPromoted.splice(idx, 1);
      if (act === 'note') {
        const n = prompt('Editor note:', currentPromoted[idx].note || '');
        if (n !== null) currentPromoted[idx].note = n;
      }
      if (act === 'up' || act === 'down') {
        const cat = currentPromoted[idx].category;
        const sameCategoryIdxs = currentPromoted.map((p, i) => p.category === cat ? i : -1).filter(i => i >= 0);
        const pos = sameCategoryIdxs.indexOf(idx);
        const swapWith = act === 'up' ? pos - 1 : pos + 1;
        if (swapWith >= 0 && swapWith < sameCategoryIdxs.length) {
          const j = sameCategoryIdxs[swapWith];
          [currentPromoted[idx], currentPromoted[j]] = [currentPromoted[j], currentPromoted[idx]];
        }
      }
      renderPromoBoxes();
      renderStatStrip();
    });
  });
}

function detailNodeHtml(node, path) {
  const hasOwnContent = !!(node.paragraph || (node.items && node.items.length) || node.table);
  let body = '';
  if (node.paragraph) body += `<p>${linkify(node.paragraph)}</p>`;
  if (node.type === 'timeline' && node.items && node.items.length) {
    body += node.items.map(it => `<div class="timeline-item">${linkify(it)}</div>`).join('');
  } else if (node.type === 'entities' && node.items && node.items.length) {
    body += node.items.map(it => `<span class="entity-chip">${linkify(it)}</span>`).join('');
  } else if (node.items && node.items.length) {
    body += `<ul>` + node.items.map(it => `<li>${linkify(it)}</li>`).join('') + `</ul>`;
  }
  if (node.table) {
    body += `<table class="mtable"><thead><tr>${node.table.headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>` +
      node.table.rows.map(r => `<tr>${r.map(c => `<td>${linkify(c)}</td>`).join('')}</tr>`).join('') + `</tbody></table>`;
  }
  const childrenHtml = (node.children || []).map((c, i) => detailNodeHtml(c, path + '-' + i)).join('');
  return `
    <div class="tree-node" data-lvl="${node.level}" id="dsec-${path}">

    headEl.addEventListener('click', () => {
      chevron.classList.toggle('open');
      if (body) body.classList.toggle('collapsed');
      const children = node.querySelector(':scope > .tree-children');
      if (children) children.style.display = children.style.display === 'none' ? '' : 'none';
    });
  });

  const tocChips = Array.from(el.querySelectorAll('#showcaseToc .toc-chip'));
  const sectionEls = tocChips.map(c => document.getElementById(c.getAttribute('href').slice(1)));
  function updateSpy() {
    let activeIdx = 0;
    for (let i = 0; i < sectionEls.length; i++) {
      if (sectionEls[i] && sectionEls[i].getBoundingClientRect().top < 160) activeIdx = i;
    }
    tocChips.forEach((c, i) => c.classList.toggle('active', i === activeIdx));
  }
  window.addEventListener('scroll', updateSpy);
  updateSpy();

  showView('detail');
  sbUpdate('dna_agent_briefs', row.id, { view_count: (row.view_count || 0) + 1 }).catch(() => {});
}

let copilotWindowRef = null;
function openCopilotPopup(promptText) {
  if (promptText) navigator.clipboard.writeText(promptText).catch(() => {});
  if (copilotWindowRef && !copilotWindowRef.closed) {
    copilotWindowRef.focus();
  } else {
    const w = 460, h = 760;
    const left = Math.max(0, (window.screenX || 0) + (window.outerWidth || 1200) - w - 24);
    const top = Math.max(0, (window.screenY || 0) + 60);
    copilotWindowRef = window.open('https://m365.cloud.microsoft/chat/', 'pilotdesk_copilot', `width=${w},height=${h},left=${left},top=${top},noopener,noreferrer`);
    if (copilotWindowRef) copilotWindowRef.focus();
  }
  dashToast(promptText ? 'Copied — paste into Copilot' : 'Copilot opened');
}
document.getElementById('copilotFab').addEventListener('click', () => openCopilotPopup());

showView('library');
loadLibrary();

</script>
